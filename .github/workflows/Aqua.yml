name: Aqua
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Aqua.jl
        run: |
          for pkg in MadIPMCore MadIPM; do
            julia --color=yes -e "using Pkg; Pkg.activate(temp=true); Pkg.add(\"Aqua\"); Pkg.develop(path=\"./MadIPMCore\"); Pkg.develop(path=\"./$pkg\"); using Aqua, $pkg; Aqua.test_all($pkg, piracies=false)"
          done
