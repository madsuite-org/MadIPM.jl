name: Run tests

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-github:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
          os: [ubuntu-22.04]
          julia-version: ['1']
          julia-arch: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - name: test MadIPMCore
        run: julia --project=./MadIPMCore --color=yes -e 'using Pkg; Pkg.test()'
      - name: test MadIPM
        run: julia --project=./MadIPM --color=yes -e 'using Pkg; Pkg.test()'
      - name: load cuMadIPM without a GPU
        run: julia --project=./cuMadIPM --color=yes -e 'using Pkg; Pkg.test()'

